<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jejak Laut — Manajemen Rantai Dingin Hasil Laut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1F2A;
    --bg:#EFF4F4;
    --surface:#FFFFFF;
    --surface-2:#E6EDED;
    --border:#D2DCDC;
    --muted:#546A6E;
    --accent:#166E7E;
    --accent-ink:#0B4956;
    --accent-soft:#DCEDEF;
    --amber:#B9711F;
    --amber-soft:#F6E7D3;
    --green:#227A50;
    --green-soft:#DBEEE2;
    --red:#B03A2E;
    --red-soft:#F6DFDA;
    --blue:#2F5F8A;
    --blue-soft:#DEE9F3;
    --grey-soft:#E4E8E9;
    --grey-ink:#4B5B5E;
    --font-ui:'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --radius:6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E7F0F0;
      --bg:#0A1A20;
      --surface:#0F262D;
      --surface-2:#143039;
      --border:#204049;
      --muted:#8FA8AB;
      --accent:#4FB6C7;
      --accent-ink:#BEEAF0;
      --accent-soft:#123B44;
      --amber:#E3A45C;
      --amber-soft:#3A2C14;
      --green:#5FBF8E;
      --green-soft:#123526;
      --red:#E0776A;
      --red-soft:#3A1D18;
      --blue:#7FAAD6;
      --blue-soft:#152C40;
      --grey-soft:#1B3038;
      --grey-ink:#9FB4B7;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#E7F0F0;
    --bg:#0A1A20;
    --surface:#0F262D;
    --surface-2:#143039;
    --border:#204049;
    --muted:#8FA8AB;
    --accent:#4FB6C7;
    --accent-ink:#BEEAF0;
    --accent-soft:#123B44;
    --amber:#E3A45C;
    --amber-soft:#3A2C14;
    --green:#5FBF8E;
    --green-soft:#123526;
    --red:#E0776A;
    --red-soft:#3A1D18;
    --blue:#7FAAD6;
    --blue-soft:#152C40;
    --grey-soft:#1B3038;
    --grey-ink:#9FB4B7;
    color-scheme: dark;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    font-size:14.5px;
    line-height:1.5;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  a{ color:inherit; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

  #app{ display:flex; min-height:100%; }

  /* ---------- Sidebar (fixed dark chrome, brand identity) ---------- */
  .sidebar{
    width:246px; flex:none;
    background:#0B1F2A;
    color:#DCEAEA;
    display:flex; flex-direction:column;
    border-right:1px solid #143039;
    position:sticky; top:0; height:100vh;
    padding-top:env(safe-area-inset-top,0px);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:20px 18px 16px;
    border-bottom:1px solid #143039;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(160deg,#1B7A8C,#0B4956);
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .brand-name{ font-weight:700; font-size:16px; letter-spacing:0.2px; color:#F2F8F8; line-height:1.15; }
  .brand-sub{ font-size:10.5px; color:#7FA0A5; margin-top:2px; }

  .nav-scroll{ flex:1; overflow-y:auto; padding:14px 10px 10px; }
  .nav-group-label{ font-size:11px; color:#5F8489; padding:12px 10px 6px; }
  .nav-group-label:first-child{ padding-top:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:6px; color:#BFD6D8;
    text-decoration:none; cursor:pointer; font-size:13.5px;
    border:1px solid transparent; background:none; width:100%; text-align:left;
  }
  .nav-item svg{ width:17px; height:17px; flex:none; opacity:0.85; }
  .nav-item:hover{ background:#122A32; color:#EAF5F5; }
  .nav-item.active{ background:#123B44; color:#8FE0EC; border-color:#1B5A66; }
  .nav-item.active svg{ opacity:1; }

  .sidebar-foot{
    border-top:1px solid #143039; padding:12px 16px 16px;
    font-size:11px; color:#5F8489;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  }
  .sidebar-foot b{ color:#9FC3C7; font-weight:600; }
  .sidebar-user-name{ color:#EAF5F5; font-weight:600; font-size:12.5px; }
  .sidebar-user-role{ color:#7FA0A5; font-size:11px; margin-top:1px; }

  .sidebar-close{ display:none; }

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    width:100%; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  .auth-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:26px 26px 22px; box-shadow:0 10px 34px rgba(11,31,42,0.08);
  }
  .auth-brand{ display:flex; align-items:center; gap:10px; }
  .auth-sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .auth-head-row{ margin-top:16px; display:flex; align-items:center; justify-content:space-between; }
  .auth-form{ margin-top:16px; display:flex; flex-direction:column; gap:12px; }
  .auth-error{
    background:var(--red-soft); color:var(--red); border-radius:6px; padding:8px 10px;
    font-size:12.5px; margin-top:12px;
  }
  .auth-notice{
    background:var(--accent-soft, #E7F1F1); color:var(--accent); border-radius:6px; padding:8px 10px;
    font-size:12.5px; margin-top:12px;
  }
  .auth-foot{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); text-align:center; }

  /* ---------- Main column ---------- */
  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:14px 22px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .hamburger{
    display:none; border:1px solid var(--border); background:var(--surface);
    width:36px; height:36px; border-radius:6px; align-items:center; justify-content:center; cursor:pointer;
  }
  .hamburger svg{ width:18px; height:18px; }
  .topbar-titles{ flex:1; min-width:0; }
  .topbar-title{ font-size:19px; font-weight:600; margin:0; }
  .topbar-desc{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }

  .search-box{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface);
    border-radius:6px; padding:7px 10px; min-width:180px;
  }
  .search-box svg{ width:15px; height:15px; color:var(--muted); flex:none; }
  .search-box input{
    border:none; background:none; outline:none; color:var(--ink);
    font-family:var(--font-ui); font-size:13px; width:100%;
  }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border-radius:6px; border:1px solid var(--border);
    padding:8px 13px; font-size:13.5px; font-weight:500;
    background:var(--surface); color:var(--ink); cursor:pointer;
    white-space:nowrap;
  }
  .btn svg{ width:15px; height:15px; }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#F2FBFC; }
  .btn-primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); }
  .btn-ghost{ border-color:transparent; background:none; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ color:var(--red); }
  .btn-sm{ padding:5px 9px; font-size:12.5px; }
  .icon-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:6px;
    width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:hover{ background:var(--surface-2); }

  main{ flex:1; padding:20px 22px 60px; max-width:1280px; width:100%; }

  /* ---------- Cards / panels ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .panel + .panel{ margin-top:14px; }
  .panel-accent{ border-left:3px solid var(--accent); }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--tone,var(--accent));
    border-radius:var(--radius); padding:13px 14px;
  }
  .stat-tile .stat-label{ font-size:12px; color:var(--muted); }
  .stat-tile .stat-value{ font-family:var(--font-mono); font-size:22px; font-weight:600; margin-top:4px; }
  .stat-tile .stat-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .hero{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 24px;
  }
  .hero-top{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hero-label{ font-size:13px; color:var(--muted); }
  .hero-updated{ font-size:11.5px; color:var(--muted); }
  .hero-figure{ display:flex; align-items:baseline; gap:8px; margin-top:6px; }
  .hero-num{ font-family:var(--font-mono); font-size:40px; font-weight:600; letter-spacing:-0.5px; }
  .hero-unit{ font-size:15px; color:var(--muted); }
  .gauge{ height:10px; border-radius:5px; background:var(--surface-2); margin-top:14px; overflow:hidden; border:1px solid var(--border); }
  .gauge-fill{ height:100%; border-radius:5px; background:var(--accent); }
  .gauge-caption{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:6px; }

  .section-title{ font-size:14px; font-weight:600; margin:0 0 2px; }
  .section-desc{ font-size:12px; color:var(--muted); margin:0 0 10px; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }

  .mini-list{ display:flex; flex-direction:column; gap:0; }
  .mini-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .mini-row:last-child{ border-bottom:none; }
  .mini-row-main{ min-width:0; }
  .mini-row-title{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-row-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .empty-note{ font-size:12.5px; color:var(--muted); padding:10px 0; }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  table.tbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  table.tbl th{
    text-align:left; font-weight:500; color:var(--muted); font-size:11.5px;
    padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-2);
    white-space:nowrap;
  }
  table.tbl td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.tbl tr:last-child td{ border-bottom:none; }
  table.tbl tr:hover td{ background:var(--surface-2); }
  .mono{ font-family:var(--font-mono); font-size:12.5px; }
  .cell-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .cell-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .link-btn{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:12.5px; padding:0; font-family:inherit; }
  .link-btn:hover{ text-decoration:underline; }
  .col-right{ text-align:right; }

  /* ---------- Badges ---------- */
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:4px; font-size:11.5px; font-weight:500; white-space:nowrap;
  }
  .badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge-teal{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge-green{ background:var(--green-soft); color:var(--green); }
  .badge-amber{ background:var(--amber-soft); color:var(--amber); }
  .badge-red{ background:var(--red-soft); color:var(--red); }
  .badge-blue{ background:var(--blue-soft); color:var(--blue); }
  .badge-grey{ background:var(--grey-soft); color:var(--grey-ink); }

  /* ---------- Forms ---------- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:12px; color:var(--muted); }
  .field input, .field select, .field textarea{
    border:1px solid var(--border); border-radius:6px; padding:8px 10px;
    background:var(--surface); color:var(--ink); font-family:var(--font-ui); font-size:13.5px; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:64px; font-family:var(--font-ui); }
  .field-hint{ font-size:11px; color:var(--muted); }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,16,20,0.55);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; padding-top:calc(40px + env(safe-area-inset-top,0px));
    overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--surface); border-radius:10px; border:1px solid var(--border);
    width:100%; max-width:640px; padding:20px 22px 22px;
  }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .modal-title{ font-size:16px; font-weight:600; margin:0; }
  .modal-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .modal-close{ border:none; background:none; cursor:pointer; color:var(--muted); width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px; }
  .modal-close:hover{ background:var(--surface-2); }
  #modal-root:empty{ display:none; }

  /* ---------- Toast ---------- */
  #toast-root{ position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:7px; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,0.18); animation:toast-in 0.18s ease-out; max-width:320px;
  }
  .toast-error{ background:var(--red); color:#FCEEEC; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* ---------- Detail page bits ---------- */
  .back-link{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0; margin-bottom:10px; }
  .back-link svg{ width:14px; height:14px; }
  .back-link:hover{ color:var(--ink); }
  .detail-grid{ display:grid; grid-template-columns:2fr 1fr; gap:14px; align-items:start; }
  .kv-list{ display:flex; flex-direction:column; gap:9px; }
  .kv-row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .kv-row .k{ color:var(--muted); }
  .kv-row .v{ text-align:right; }
  .subhead-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }

  .filter-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    border:1px solid var(--border); background:var(--surface); border-radius:20px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; color:var(--muted);
  }
  .chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }

  .cs-card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; background:var(--surface); }
  .cs-name{ font-size:13.5px; font-weight:600; }
  .cs-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .cs-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:12px; }

  @media (max-width: 980px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .two-col{ grid-template-columns:1fr; }
    .detail-grid{ grid-template-columns:1fr; }
    .form-grid{ grid-template-columns:1fr; }
  }
  .mobile-backdrop{ display:none; }
  @media (max-width: 880px){
    .sidebar{
      position:fixed; left:0; top:0; bottom:0; z-index:90; transform:translateX(-100%);
      transition:transform 0.2s ease; width:264px;
    }
    #app.sidebar-open .sidebar{ transform:translateX(0); }
    .mobile-backdrop{
      display:none; position:fixed; inset:0; background:rgba(6,16,20,0.5); z-index:80;
    }
    #app.sidebar-open .mobile-backdrop{ display:block; }
    .hamburger{ display:inline-flex; }
    .sidebar-close{ display:inline-flex; margin-left:auto; }
    main{ padding:16px 14px 48px; }
    .topbar{ padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top,0px)); }
    .search-box{ min-width:0; }
  }
  @media (max-width: 620px){
    .stat-grid{ grid-template-columns:1fr 1fr; }
    .topbar-desc{ display:none; }
    table.tbl{ min-width:560px; }
  }
</style>
</head>
<body>
<div id="auth-root" style="display:none"></div>
<div id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EAF7F8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3 2 6 2 9 0s6-2 9 0"/><path d="M3 19c3 2 6 2 9 0s6-2 9 0"/><path d="M12 3c2 3 2 6 0 9-2-3-2-6 0-9Z"/><path d="M12 12v3"/></svg>
      </div>
      <div>
        <div class="brand-name">Jejak Laut</div>
        <div class="brand-sub">PPS Lampulo · Rantai Dingin</div>
      </div>
      <button class="icon-btn sidebar-close" data-action="close-sidebar" aria-label="Tutup menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav class="nav-scroll" id="sidebar-nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <div class="mobile-backdrop" data-action="close-sidebar"></div>

  <div class="main-col">
    <div class="topbar">
      <button class="hamburger" data-action="open-sidebar" aria-label="Buka menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-titles">
        <h1 class="topbar-title" id="topbar-title">Ringkasan</h1>
        <div class="topbar-desc" id="topbar-desc"></div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <main id="main"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ============================================================
   Utilities
   ============================================================ */
function uid(prefix){ return (prefix ? prefix+'_' : '') + Math.random().toString(36).slice(2,9); }
function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(n, d){
  if(n===null||n===undefined||n==='') return '—';
  d = d===undefined?1:d;
  var num = Number(n);
  if(isNaN(num)) return '—';
  return num.toLocaleString('id-ID', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) + ', ' +
         d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
}
function toLocalInput(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  function pad(n){ return String(n).padStart(2,'0'); }
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fromLocalInput(val){
  if(!val) return null;
  var d = new Date(val);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}
function nowIso(){ return new Date().toISOString(); }
function daysAgoIso(n, hour){
  var d = new Date();
  d.setDate(d.getDate()-n);
  if(hour!==undefined) d.setHours(hour, (n*7)%60, 0, 0);
  return d.toISOString();
}

var SUPA_TABLES = {
  users:'users', vessels:'vessels', buyers:'buyers', coldStorages:'cold_storages',
  catchBatches:'catch_batches', inventoryItems:'inventory_items', shipments:'shipments',
  shipmentItems:'shipment_items', shipmentLogs:'shipment_logs',
  proofOfDeliveries:'proof_of_deliveries', claims:'claims'
};
function orNull(v){ return (v===undefined || v===null || v==='') ? null : v; }

async function supaFetchAll(){
  var next = {};
  for(var key in SUPA_TABLES){
    var res = await supaClient.from(SUPA_TABLES[key]).select('*');
    if(res.error) throw res.error;
    next[key] = res.data || [];
  }
  db = next;
}
async function persistInsert(key, payload, demoPrefix){
  if(mode==='live'){
    var res = await supaClient.from(SUPA_TABLES[key]).insert(payload).select().single();
    if(res.error) throw res.error;
    db[key].push(res.data);
    return res.data;
  }
  var row = Object.assign({id: uid(demoPrefix||key)}, payload);
  db[key].push(row);
  return row;
}
async function persistUpdate(key, id, payload){
  if(mode==='live'){
    var res = await supaClient.from(SUPA_TABLES[key]).update(payload).eq('id', id).select().single();
    if(res.error) throw res.error;
    var idx = db[key].findIndex(function(r){ return r.id===id; });
    if(idx>-1) db[key][idx] = res.data;
    return res.data;
  }
  var row = byId(db[key], id);
  if(row) Object.assign(row, payload);
  return row;
}
async function persistDelete(key, id){
  if(mode==='live'){
    var res = await supaClient.from(SUPA_TABLES[key]).delete().eq('id', id);
    if(res.error) throw res.error;
  }
  removeById(db[key], id);
}
function connectSupabaseClient(url, key){
  if(!window.supabase || !window.supabase.createClient){
    throw new Error('Pustaka Supabase belum termuat di halaman ini.');
  }
  supaClient = window.supabase.createClient(url, key);
  mode = 'live';
  saveSupaConfig({url:url, key:key});
}

  // Dipakai dari halaman Pengaturan saat sudah masuk (admin) — langsung tarik seluruh data.
  connectSupabaseClient(url, key);
  await supaFetchAll();
}
function disconnectSupabase(){
  if(supaClient){ try{ supaClient.auth.signOut(); }catch(e){} }
  supaClient = null;
  mode = 'demo';
  clearSupaConfig();
  db = loadDB();

  clearSessionUserId();
}

function findProfileForAuthUser(authUser){
  if(!authUser) return null;
  var byAuthId = db.users.find(function(u){ return u.auth_user_id && u.auth_user_id===authUser.id; });
  if(byAuthId) return byAuthId;
  if(authUser.email){
    return db.users.find(function(u){ return u.email && u.email.toLowerCase()===authUser.email.toLowerCase(); }) || null;
  }
  return null;
}

async function doLogin(email, password){
  if(mode==='live'){
    if(!supaClient) throw new Error('Belum tersambung ke Supabase. Sambungkan proyek Anda terlebih dahulu.');
    var res = await supaClient.auth.signInWithPassword({email:email, password:password});
    if(res.error) throw new Error(res.error.message || 'Email atau kata sandi salah.');
    await supaFetchAll();
    var profile = findProfileForAuthUser(res.data.user);
    if(!profile){
      await supaClient.auth.signOut();
      throw new Error('Berhasil masuk ke Supabase, tetapi tidak ada profil pada tabel "users" yang cocok (isi kolom auth_user_id atau samakan email).');
    }
    currentUser = profile;
  } else {
    var u = db.users.find(function(x){ return x.email && x.email.toLowerCase()===email.toLowerCase() && x.password===password; });
    if(!u) throw new Error('Email atau kata sandi salah.');
    currentUser = u;
    saveSessionUserId(u.id);
  }
}
async function doLogout(){
  if(mode==='live' && supaClient){ try{ await supaClient.auth.signOut(); }catch(err){} }
  currentUser = null;
  clearSessionUserId();
  authView = 'login'; authNotice = null; authError = null;
  route = {page:'dashboard', id:null};
  renderShell();
}

// Pendaftaran mandiri staf lewat tautan undangan (opsi "Undangan via link daftar mandiri").
// Profil (nama, peran, email) harus sudah dibuat admin di menu Pengguna lebih dulu;
// fungsi ini hanya membuat akun Supabase Auth-nya lalu menautkannya via kecocokan email.
async function doSignup(email, password, confirmPassword){
  if(mode!=='live' || !supaClient) throw new Error('Sambungkan ke Supabase terlebih dahulu sebelum mendaftar.');
  if(password.length<6) throw new Error('Kata sandi minimal 6 karakter.');
  if(password!==confirmPassword) throw new Error('Konfirmasi kata sandi tidak sama dengan kata sandi.');
  var profile = db.users.find(function(u){ return u.email && u.email.toLowerCase()===email.toLowerCase(); });
  if(!profile) throw new Error('Email ini belum didaftarkan sebagai staf. Minta admin menambahkannya dulu di menu Pengguna.');
  var res = await supaClient.auth.signUp({email:email, password:password});
  if(res.error) throw new Error(res.error.message || 'Pendaftaran gagal.');
  var authUserId = res.data && res.data.user && res.data.user.id;
  if(authUserId){
    try{ await persistUpdate('users', profile.id, {auth_user_id:authUserId}); }catch(err){ /* tetap lanjut, nanti bisa cocok lewat email */ }
  }
  if(res.data && res.data.session){
    // Proyek tidak mewajibkan verifikasi email — langsung aktif.
    await supaFetchAll();
    currentUser = findProfileForAuthUser(res.data.user) || profile;
    return {needsConfirmation:false};
  }
  return {needsConfirmation:true};
}

function toast(msg, isError){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast' + (isError ? ' toast-error' : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 260); }, isError?4200:2400);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function csvEscape(v){
  if(v===null||v===undefined) return '';
  var s = String(v);
  if(/[",\r\n]/.test(s)){ s = '"'+s.replace(/"/g,'""')+'"'; }
  return s;
}
function toCSV(rows, columns){
  var header = columns.join(',');
  var lines = rows.map(function(r){ return columns.map(function(c){ return csvEscape(r[c]); }).join(','); });
  return [header].concat(lines).join('\r\n');
}
function downloadText(filename, text, mime){
  var blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function parseCSV(text){
  var rows = [], row = [], field = '', inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  var headers = rows[0].map(function(h){ return h.trim(); });
  return rows.slice(1)
    .filter(function(r){ return r.some(function(v){ return v && v.trim()!==''; }); })
    .map(function(r){ var obj={}; headers.forEach(function(h,idx){ obj[h]=r[idx]!==undefined?r[idx]:''; }); return obj; });
}
function readFileAsText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result||'')); };
    reader.onerror = function(){ reject(reader.error || new Error('Gagal membaca berkas.')); };
    reader.readAsText(file);
  });
}

function exportTableCSV(key){
  var cols = TABLE_COLUMNS[key];
  downloadText(key+'.csv', toCSV(db[key], cols), 'text/csv');
  toast(esc(TABLE_LABELS[key])+' diekspor ke CSV');

var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
async function importBackupFile(file){
  var text = await readFileAsText(file);
  var parsed;
  try{ parsed = JSON.parse(text); }catch(e){ throw new Error('Berkas bukan JSON yang valid.'); }
  if(!parsed || !parsed.data) throw new Error('Format cadangan tidak dikenali.');
  if(mode==='live'){
    var allValid = true;
    for(var k in parsed.data){
      (parsed.data[k]||[]).forEach(function(row){ if(row.id && !UUID_RE.test(row.id)) allValid=false; });
    }
    if(!allValid){
      throw new Error('Cadangan ini berasal dari mode demo (ID bukan UUID) dan tidak bisa ditulis langsung ke Supabase. Gunakan impor CSV untuk data baru, atau impor cadangan ini saat berada di mode demo.');
    }
    var order = ['users','vessels','buyers','coldStorages','catchBatches','inventoryItems','shipments','shipmentItems','shipmentLogs','proofOfDeliveries','claims'];
    for(var i=0;i<order.length;i++){
      var key = order[i];
      var rows = parsed.data[key];
      if(rows && rows.length){
        var res = await supaClient.from(SUPA_TABLES[key]).upsert(rows);
        if(res.error) throw new Error('Gagal mengimpor '+TABLE_LABELS[key]+': '+res.error.message);
      }
    }
    await supaFetchAll();
  } else {
    var next = {};
    for(var k2 in TABLE_LABELS){ next[k2] = parsed.data[k2] || []; }
    db = next;
  }
}

async function importBatchesCSV(file){
  var rows = parseCSV(await readFileAsText(file));
  var okCount=0, errors=[];

    var r = rows[i];

    var payload = {
      lot_number:r.lot_number, vessel_id: vessel_?vessel_.id:null,
      landing_date: r.tanggal_mendarat ? (new Date(r.tanggal_mendarat.replace(' ','T')).toISOString()) : nowIso(),
      landing_port:r.pelabuhan||'PPS Lampulo', wpp_zone:r.zona_wpp||'WPPNRI 572',
      qc_officer_id: qc_?qc_.id:null, notes:r.catatan||''
    };
    try{ await persistInsert('catchBatches', payload, 'cb'); okCount++; }
    catch(err){ errors.push('Baris '+(i+2)+': '+err.message); }
  }
  return {okCount:okCount, errors:errors};

async function importItemsCSV(file){
  var rows = parseCSV(await readFileAsText(file));
  var okCount=0, errors=[];
  for(var i=0;i<rows.length;i++){
    var r = rows[i];

    if(!batchRow){ errors.push('Baris '+(i+2)+': lot_number "'+r.lot_number+'" tidak ditemukan'); continue; }
    var payload = {
      qr_code_id:r.qr_code_id, batch_id:batchRow.id, fish_species:r.spesies||'',
      processing_type: ENUMS.processing_type[r.jenis_olahan] ? r.jenis_olahan : 'whole',
      grade:r.grade||'A',
      gross_weight_kg:Number(r.berat_kotor_kg)||0, net_weight_kg:Number(r.berat_bersih_kg)||0,
      core_temperature_celsius:Number(r.suhu_inti)||0,
      status: ENUMS.product_status[r.status] ? r.status : 'in_stock'
    };
    try{ await persistInsert('inventoryItems', payload, 'i'); okCount++; }
    catch(err){ errors.push('Baris '+(i+2)+': '+err.message); }
  }
  return {okCount:okCount, errors:errors};
}

function groupSum(list, keyFn, weightFn){
  var map = {}, order = [];
  list.forEach(function(it){
    var k = keyFn(it);
    if(!map[k]){ map[k] = {key:k, count:0, total:0}; order.push(k); }
    map[k].count += 1;
    map[k].total += Number(weightFn ? weightFn(it) : 0) || 0;
  });
  return order.map(function(k){ return map[k]; });
}

/* ============================================================

   ============================================================ */
function removeById(list, id){
  var idx = -1;
  for(var i=0;i<list.length;i++){ if(list[i].id===id){ idx=i; break; } }
  if(idx>-1) list.splice(idx,1);
}
function confirmDelete(label){ return window.confirm('Hapus '+label+'? Tindakan ini tidak dapat dibatalkan.'); }

/* ============================================================
   Event delegation
   ============================================================ */
document.addEventListener('click', async function(e){
  var navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    route = {page:navBtn.getAttribute('data-nav'), id:navBtn.getAttribute('data-id')||null};
    searchTerm=''; invFilter='all'; claimFilter='all';
    closeMobileSidebar();
    renderAll();
    window.scrollTo(0,0);
    return;
  }

  var backdrop = e.target.closest('[data-action="backdrop-close"]');
  if(backdrop && e.target===backdrop){ closeModal(); return; }

  var act = e.target.closest('[data-action]');
  if(!act) return;
  var action = act.getAttribute('data-action');
  var id = act.getAttribute('data-id');

  switch(action){
    case 'open-sidebar': document.getElementById('app').classList.add('sidebar-open'); return;
    case 'close-sidebar': document.getElementById('app').classList.remove('sidebar-open'); return;
    case 'close-modal': closeModal(); return;

    case 'open-vessel-modal': openVesselModal(id); return;
    case 'delete-vessel':
      if(confirmDelete('kapal ini')){
        try{ await persistDelete('vessels', id); renderAll(); toast('Kapal dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-buyer-modal': openBuyerModal(id); return;
    case 'delete-buyer':
      if(confirmDelete('pembeli ini')){
        try{ await persistDelete('buyers', id); renderAll(); toast('Pembeli dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-cs-modal': openCsModal(id); return;
    case 'delete-cs':
      if(confirmDelete('cold storage ini')){
        try{ await persistDelete('coldStorages', id); renderAll(); toast('Cold storage dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-user-modal': openUserModal(id); return;
    case 'delete-user':
      if(confirmDelete('pengguna ini')){
        try{ await persistDelete('users', id); renderAll(); toast('Pengguna dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-batch-modal': openBatchModal(id); return;
    case 'delete-batch':
      if(confirmDelete('batch pendaratan ini')){
        try{ await persistDelete('catchBatches', id); renderAll(); toast('Batch dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-item-modal': openItemModal(id); return;
    case 'delete-item':
      if(confirmDelete('item inventaris ini')){
        try{ await persistDelete('inventoryItems', id); renderAll(); toast('Item dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-shipment-modal': openShipmentModal(id); return;
    case 'delete-shipment':
      if(confirmDelete('pengiriman ini')){
        try{ await persistDelete('shipments', id); renderAll(); toast('Pengiriman dihapus'); }
        catch(err){ toastError(err); }
      } return;

    case 'open-log-modal': openLogModal(id); return;
    case 'open-pod-modal': openPodModal(id); return;
    case 'open-claim-modal': openClaimModal(id); return;

    case 'add-shipment-item':
      var sel = document.getElementById('add-item-select');
      if(sel && sel.value){
        try{
          await persistInsert('shipmentItems', {shipment_id:id, item_id:sel.value}, 'si');
          var it = item(sel.value);
          if(it && it.status==='in_stock'){ await persistUpdate('inventoryItems', it.id, {status:'reserved'}); }
          renderAll();
          toast('Item dimuat ke pengiriman');
        }catch(err){ toastError(err); }
      }
      return;
    case 'remove-shipment-item':
      try{ await persistDelete('shipmentItems', id); renderAll(); toast('Item dikeluarkan dari pengiriman'); }
      catch(err){ toastError(err); }
      return;

    case 'approve-claim':
      try{ await persistUpdate('claims', id, {status:'approved'}); renderAll(); toast('Klaim disetujui'); }
      catch(err){ toastError(err); }
      return;
    case 'reject-claim':
      try{ await persistUpdate('claims', id, {status:'rejected'}); renderAll(); toast('Klaim ditolak'); }
      catch(err){ toastError(err); }
      return;

    case 'filter-inv': invFilter = id; renderMain(); return;
    case 'filter-claims': claimFilter = id; renderMain(); return;

    case 'export-report-species':
      downloadText('stok_per_spesies.csv', toCSV(groupSum(db.inventoryItems, function(it){return it.fish_species;}, function(it){return it.net_weight_kg;}).map(function(g){return {spesies:g.key, jumlah_item:g.count, total_berat_bersih_kg:g.total.toFixed(1)};}), ['spesies','jumlah_item','total_berat_bersih_kg']), 'text/csv');
      return;
    case 'export-report-status':
      downloadText('stok_per_status.csv', toCSV(groupSum(db.inventoryItems, function(it){return it.status;}, function(it){return it.net_weight_kg;}).map(function(g){return {status:g.key, jumlah_item:g.count, total_berat_bersih_kg:g.total.toFixed(1)};}), ['status','jumlah_item','total_berat_bersih_kg']), 'text/csv');
      return;
    case 'export-report-buyer':
      downloadText('pengiriman_per_pembeli.csv', toCSV(groupSum(db.shipments, function(s){return buyerName(s.buyer_id);}, function(s){return itemsInShipment(s.id).reduce(function(a,x){return a+Number(x.item.net_weight_kg||0);},0);}).map(function(g){return {pembeli:g.key, jumlah_pengiriman:g.count, total_berat_kg:g.total.toFixed(1)};}), ['pembeli','jumlah_pengiriman','total_berat_kg']), 'text/csv');
      return;
    case 'export-report-claimtype':
      downloadText('klaim_per_jenis.csv', toCSV(groupSum(db.claims, function(c){return c.claim_type;}, function(c){return c.claimed_weight_kg;}).map(function(g){return {jenis_klaim:enumLabel('claim_type',g.key), jumlah:g.count, total_berat_diklaim_kg:g.total.toFixed(1)};}), ['jenis_klaim','jumlah','total_berat_diklaim_kg']), 'text/csv');
      return;
    case 'export-table-csv': exportTableCSV(id); return;
    case 'export-backup': exportBackup(); return;
    case 'download-template': downloadTemplate(id); return;
    case 'dismiss-import-report': lastImportReport = null; renderMain(); return;

    case 'disconnect-supabase':
      disconnectSupabase();
      renderShell();
      toast('Kembali ke mode demo');
      return;

    case 'logout':
      await doLogout();
      toast('Berhasil keluar');
      return;
    case 'open-connect-modal': openConnectModal(); return;

    case 'show-signup':
      authView = 'signup'; authError = null; authNotice = null;
      renderAuthScreen();
      return;
    case 'show-login':
      authView = 'login'; authError = null; authNotice = null;
      renderAuthScreen();
      return;
    case 'copy-invite-link': {
      var invUser = user(id);
      if(!invUser){ return; }
      var link = window.location.origin + window.location.pathname + '#signup=' + encodeURIComponent(invUser.email);
      copyToClipboard(link);
      toast('Tautan undangan untuk '+invUser.full_name+' disalin. Kirim via WhatsApp/email.');
      return;
    }
  }
});

  var editId = form.getAttribute('data-edit-id') || '';
  var data = {};
  new FormData(form).forEach(function(v,k){ data[k]=v; });
  var submitBtn = form.querySelector('button[type="submit"]');
  var originalLabel = submitBtn ? submitBtn.textContent : '';
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Menyimpan...'; }

  try{
    switch(type){
      case 'vessel': await saveVessel(data, editId); break;
      case 'buyer': await saveBuyer(data, editId); break;
      case 'cs': await saveCs(data, editId); break;
      case 'user': await saveUser(data, editId); break;
      case 'batch': await saveBatch(data, editId); break;
      case 'item': await saveItem(data, editId); break;
      case 'shipment': await saveShipment(data, editId); break;
      case 'log': await saveLog(data, editId); break;
      case 'pod': await savePod(data, editId); break;
      case 'claim': await saveClaim(data); break;
      case 'connect-supabase': await connectSupabase(data.url.trim(), data.key.trim()); toast('Berhasil tersambung ke Supabase'); break;
      case 'connect-supabase-preauth': connectSupabaseClient(data.url.trim(), data.key.trim()); break;
      case 'login': await doLogin(data.email.trim(), data.password); break;
      case 'signup': var signupResult = await doSignup(data.email.trim(), data.password, data.confirm_password); break;
    }
    if(type==='login'){
      authError = null; authEmail = ''; authNotice = null;
      renderShell();
    } else if(type==='signup'){
      authError = null;
      if(signupResult && signupResult.needsConfirmation){
        authNotice = 'Pendaftaran berhasil! Cek email Anda untuk konfirmasi (jika diminta), lalu kembali ke sini dan masuk.';
        authView = 'login'; authEmail = data.email || '';
        renderAuthScreen();
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
      } else {
        authNotice = null; authEmail = '';
        renderShell();
      }
    } else if(type==='connect-supabase-preauth'){
      closeModal();
      toast('Tersambung ke Supabase. Silakan masuk dengan akun Anda.');
      renderAuthScreen();
    } else {
      closeModal();
      renderAll();
    }
  }catch(err){
    if(type==='login' || type==='signup'){
      authError = (err && err.message) || 'Terjadi kesalahan.';
      authEmail = data.email || '';
      renderAuthScreen();
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
    } else {
      toastError(err);
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
    }
  }
});

document.addEventListener('change', async function(e){
  var el = e.target;
  if(el.matches('[data-import="backup"]')){
    var f1 = el.files[0]; if(!f1) return;
    try{ await importBackupFile(f1); renderAll(); toast('Cadangan berhasil diimpor'); }
    catch(err){ toastError(err); }
    el.value = '';
  } else if(el.matches('[data-import="batches-csv"]')){
    var f2 = el.files[0]; if(!f2) return;
    try{
      var r2 = await importBatchesCSV(f2);
      lastImportReport = r2;
      renderAll();
      toast(r2.okCount+' batch berhasil diimpor'+(r2.errors.length?(', '+r2.errors.length+' baris gagal'):''));
    }catch(err){ toastError(err); }
    el.value = '';
  } else if(el.matches('[data-import="items-csv"]')){
    var f3 = el.files[0]; if(!f3) return;
    try{
      var r3 = await importItemsCSV(f3);
      lastImportReport = r3;
      renderAll();
      toast(r3.okCount+' item berhasil diimpor'+(r3.errors.length?(', '+r3.errors.length+' baris gagal'):''));
    }catch(err){ toastError(err); }
    el.value = '';
  }
});

document.addEventListener('input', function(e){
  if(e.target.matches('#search-input')){
    searchTerm = e.target.value.toLowerCase();
    var pos = e.target.selectionStart;
    renderMain();
    var el2 = document.getElementById('search-input');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(err){} }
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); }
});

function closeMobileSidebar(){ document.getElementById('app').classList.remove('sidebar-open'); }

/* ============================================================
   Init
   ============================================================ */
async function boot(){
  var savedSupaCfg = loadSupaConfig();
  if(savedSupaCfg && savedSupaCfg.url && savedSupaCfg.key){
    try{
      connectSupabaseClient(savedSupaCfg.url, savedSupaCfg.key);
      var sres = await supaClient.auth.getSession();
      var session = sres.data && sres.data.session;
      if(session && session.user){
        await supaFetchAll();
        var profile = findProfileForAuthUser(session.user);
        if(profile) currentUser = profile;
      }
    }catch(err){ toastError(err); }
  } else {
    var savedUserId = loadSessionUserId();
    if(savedUserId){
      var u = byId(db.users, savedUserId);
      if(u) currentUser = u;
    }
  }
  if(!currentUser) consumeInviteHash();
  renderShell();
}
boot();

})();
</script>
